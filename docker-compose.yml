version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitoring_lab
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - red_monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor_monitoring_lab
    restart: always
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080" # Mapeamos a 8081 para no chocar con otros laboratorios
    networks:
      - red_monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_monitoring_lab
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - red_monitoring

volumes:
  grafana_data:

networks:
  red_monitoring:
    driver: bridge